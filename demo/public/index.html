<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Asset Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="glow-orb" id="orb1"></div>
    <div class="glow-orb" id="orb2"></div>

    <main class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>GDrive Drop</span>
            </div>
            <h1>Upload to Google Drive</h1>
            <p>Quickly and securely save your files directly to Google Drive</p>
        </header>

        <section class="upload-card" id="dropZone">
            <input type="file" id="fileInput" hidden multiple>
            <div class="upload-content">
                <div class="icon-wrapper">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                        <path d="M12 12v9"></path>
                        <path d="m16 16-4-4-4 4"></path>
                    </svg>
                </div>
                <h3>Drag & Drop Files</h3>
                <p>or <span class="browse-btn">browse your device</span></p>
                <div class="badges">
                    <span class="badge">JPG</span>
                    <span class="badge">PNG</span>
                    <span class="badge">PDF</span>
                    <span class="badge">ZIP</span>
                </div>
            </div>
        </section>

        <div id="activeUploads" class="uploads-container hidden">
            <!-- Upload items will be injected here -->
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay hidden" id="resultModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModal">&times;</button>
            <div class="status-icon success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2>Upload Successful!</h2>
            <p id="successFileName">Your file is now safely stored on Google Drive.</p>
            
            <div class="modal-actions">
                <a id="viewBtn" href="#" target="_blank" class="btn btn-primary">Preview</a>
                <a id="downloadBtn" href="#" target="_blank" class="btn btn-secondary">Download</a>
                <button id="copyLinkBtn" class="btn btn-outline">Copy Public Link</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden">Link copied to clipboard!</div>

    <script src="app.js"></script>
</body>
</html>
